<!doctype html>
<html lang="pt-BR"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--blue:#0b5bd3;--deep:#061f50;--light:#eaf3ff;--ink:#14213d;--muted:#64748b;--line:#dbe4f0;--bg:#f4f7fb;--danger:#a31b13;font-family:Inter,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;padding:28px 16px;color:var(--ink);background:var(--bg)}main{width:min(1180px,100%);margin:auto}.back{color:var(--blue);font-weight:800;text-decoration:none}.card{margin-top:20px;padding:clamp(22px,4vw,44px);border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 18px 44px rgba(8,44,112,.12)}.eyebrow{color:var(--blue);font-size:12px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{margin:8px 0;font-size:clamp(30px,5vw,43px)}.intro,.help{color:var(--muted);line-height:1.5}.field{margin:22px 0}label{display:block;margin-bottom:7px;font-weight:800}input,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;color:var(--ink);font:inherit}input:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(35,133,255,.12)}input[readonly]{color:#475569;background:#f1f5f9}textarea{min-height:90px;resize:vertical}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;min-width:960px;border-collapse:collapse}.table th,.table td{padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;text-align:left}.table th{color:#fff;background:var(--deep);font-size:12px}.table textarea{min-width:250px;min-height:70px}.table input{min-width:150px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border:0;border-radius:11px;font-weight:800;cursor:pointer}.primary{color:#fff;background:var(--blue)}.secondary{color:var(--deep);background:var(--light)}.remove{color:var(--danger);background:#fff0f0}.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px}.message{margin:16px 0;padding:12px 14px;border-radius:11px;line-height:1.45}.error{color:#8e1b1b;background:#fff0f0}.success{color:#076849;background:#e2f8ef}[hidden]{display:none!important}@media(max-width:650px){body{padding:16px}.card{padding:22px 16px}.actions{align-items:stretch;flex-direction:column}.button{width:100%}}</style></head>
<body><main><a class="back" href="<?= appUrl ?>?page=portal">← Voltar ao portal</a><section class="card"><div class="eyebrow">Plano de ação</div><h1>Registrar planos de ação</h1><p class="intro">Adicione uma ou mais linhas. Cada linha será registrada como um plano independente.</p><div id="message" class="message" hidden role="alert"></div><form id="actionPlanForm" novalidate><div class="field"><label for="protocol">ID da solicitação</label><input id="protocol" readonly required></div><div class="table-wrap"><table class="table"><thead><tr><th>Plano de ação *</th><th>Responsável *</th><th>E-mail do responsável *</th><th>Data de entrega *</th><th>Ação</th></tr></thead><tbody id="planRows"></tbody></table></div><div class="actions"><button id="addPlan" class="button secondary" type="button">+ Adicionar plano</button><button id="submitButton" class="button primary" type="submit">Enviar planos</button></div></form></section></main>
<script>
const initialProtocol=<?!=JSON.stringify(requestId)?>,form=document.getElementById('actionPlanForm'),protocol=document.getElementById('protocol'),rows=document.getElementById('planRows'),message=document.getElementById('message'),submitButton=document.getElementById('submitButton');let canEditProtocol=false;protocol.value=initialProtocol||'';if(!protocol.value)showMessage('Abra este formulário usando o botão Plano de ação do e-mail de confirmação.');google.script.run.withSuccessHandler(access=>{canEditProtocol=Boolean(access&&access.canEditProtocol);protocol.readOnly=!canEditProtocol;if(canEditProtocol)showMessage('Você possui permissão para editar o ID da solicitação.','success')}).withFailureHandler(()=>{protocol.readOnly=true}).getActionPlanFormAccess();
function addPlan(){const row=document.createElement('tr');row.innerHTML='<td><textarea class="description" required maxlength="3000" placeholder="Descreva o plano de ação"></textarea></td><td><input class="responsible" required maxlength="180" placeholder="Nome"></td><td><input class="responsibleEmail" type="email" required maxlength="180" placeholder="nome@empresa.com"></td><td><input class="dueDate" type="date" required></td><td><button class="button remove" type="button">Remover</button></td>';row.querySelector('.remove').addEventListener('click',()=>{if(rows.children.length===1)return showMessage('Mantenha ao menos um plano.');row.remove()});rows.appendChild(row)}
document.getElementById('addPlan').addEventListener('click',addPlan);addPlan();form.addEventListener('submit',event=>{event.preventDefault();clearMessage();if(!protocol.value)return showMessage('O ID da solicitação não foi informado. Use o botão do e-mail.');for(const control of form.querySelectorAll('input,textarea')){if(!control.checkValidity()){control.reportValidity();return}}const plans=[...rows.querySelectorAll('tr')].map(row=>({description:row.querySelector('.description').value.trim(),responsible:row.querySelector('.responsible').value.trim(),responsibleEmail:row.querySelector('.responsibleEmail').value.trim(),dueDate:row.querySelector('.dueDate').value}));setSubmitting(true);google.script.run.withSuccessHandler(result=>{setSubmitting(false);form.reset();protocol.value=result.protocol;rows.innerHTML='';addPlan();showMessage(result.createdPlans+' plano(s) registrado(s) para '+result.protocol,'success')}).withFailureHandler(error=>{setSubmitting(false);showMessage(error&&error.message?error.message:String(error))}).submitActionPlans({protocol:protocol.value,originalProtocol:initialProtocol,plans})});
function setSubmitting(active){submitButton.disabled=active;submitButton.textContent=active?'Enviando...':'Enviar planos'}function showMessage(text,type='error'){message.textContent=text;message.className='message '+type;message.hidden=false}function clearMessage(){message.hidden=true;message.textContent=''}
</script></body></html>
