<script>
/**
 * Asistente Personal - v2, cliente.
 *
 * Navegación sin recarga: cambiar de sección no vuelve al servidor. Cada
 * sección pide sus datos la primera vez que se abre y después los recuerda.
 * El parámetro ?page= solo decide con cuál se abre.
 *
 * Marcar prioridad es optimista: la pantalla cambia en el acto y la escritura
 * al Sheet va por detrás. Si falla, se revierte y aparece el error.
 */

var app = {
  seccion: 'inicio',
  cargado: { inicio:false, correo:false, agenda:false, notas:false },
  fechaIso: '',
  correo: null,
  filtro: 'dia',
  notas: [],
  notaEditando: null
};

function $(id) { return document.getElementById(id); }

function esc(valor) {
  return String(valor == null ? '' : valor)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function mensajeError(error) {
  return error && error.message ? error.message : String(error);
}

function pintarError(contenedor, error) {
  $(contenedor).innerHTML = '<p class="estado error">No se pudo cargar: ' +
    esc(mensajeError(error)) + '</p>';
}

// ------------------------------------------------------------------ arranque
document.addEventListener('DOMContentLoaded', function () {
  var inicial = document.body.dataset.seccionInicial || 'inicio';

  google.script.run
    .withSuccessHandler(function (datos) {
      app.fechaIso = datos.fechaIso;
      $('cabeceraFecha').textContent = datos.fechaLarga;
      $('cabeceraCorreo').textContent = datos.correo;
    })
    .withFailureHandler(function (error) {
      $('cabeceraFecha').textContent = 'Hoy';
      $('cabeceraCorreo').textContent = mensajeError(error);
    })
    .obtenerEstadoInicial();

  document.querySelectorAll('[data-ir]').forEach(function (boton) {
    boton.addEventListener('click', function () { ir(boton.dataset.ir); });
  });

  $('btnCorreo').addEventListener('click', function () { cargarCorreo(true); });
  $('btnAgenda').addEventListener('click', cargarAgenda);
  $('formMeta').addEventListener('submit', enviarMeta);
  $('formPendiente').addEventListener('submit', enviarPendiente);
  $('formNota').addEventListener('submit', enviarNota);
  $('btnCancelarNota').addEventListener('click', salirDeEdicion);

  document.querySelectorAll('[data-filtro]').forEach(function (boton) {
    boton.addEventListener('click', function () {
      app.filtro = boton.dataset.filtro;
      document.querySelectorAll('[data-filtro]').forEach(function (otro) {
        otro.classList.toggle('activo', otro === boton);
      });
      pintarListaCorreo();
    });
  });

  ir(inicial);
});

/** Cambia de sección al instante y carga sus datos solo la primera vez. */
function ir(nombre) {
  app.seccion = nombre;

  document.querySelectorAll('.seccion').forEach(function (seccion) {
    seccion.classList.toggle('visible', seccion.id === 'seccion-' + nombre);
  });
  document.querySelectorAll('[data-ir]').forEach(function (boton) {
    boton.classList.toggle('activa', boton.dataset.ir === nombre);
  });
  window.scrollTo(0, 0);

  if (app.cargado[nombre]) return;
  app.cargado[nombre] = true;

  if (nombre === 'inicio') { cargarMetas(); cargarPendientes(); }
  if (nombre === 'correo') cargarCorreo(false);
  if (nombre === 'agenda') cargarAgenda();
  if (nombre === 'notas') cargarNotas();
}

// -------------------------------------------------------------------- correo
function cargarCorreo(forzar) {
  $('btnCorreo').disabled = true;
  if (forzar) $('correoResumen').textContent = 'Leyendo Gmail…';

  google.script.run
    .withSuccessHandler(function (datos) {
      $('btnCorreo').disabled = false;
      app.correo = datos;
      pintarCorreo();
    })
    .withFailureHandler(function (error) {
      $('btnCorreo').disabled = false;
      $('correoResumen').textContent = '';
      pintarError('correoLista', error);
    })
    .obtenerResumenCorreo(!!forzar);
}

function pintarCorreo() {
  var d = app.correo;
  var partes = [d.totales.hilos + ' hilos desde hace ' + d.ventanaHoras + ' h'];
  if (d.totales.sinLeer) partes.push(d.totales.sinLeer + ' sin leer');
  if (d.totales.esperando) partes.push(d.totales.esperando + ' esperan respuesta');
  if (d.totales.silenciados) partes.push(d.totales.silenciados + ' silenciados');
  $('correoResumen').textContent = partes.join(' · ') + ' · ' + d.generado;

  $('correoFiltros').hidden = false;

  if (d.importantes.length) {
    $('correoImportantes').innerHTML =
      '<h2 class="titulo-bloque" style="margin-top:22px">Importante</h2>' +
      listaCorreo(d.importantes);
  } else {
    $('correoImportantes').innerHTML = '';
  }

  pintarListaCorreo();
}

function pintarListaCorreo() {
  if (!app.correo) return;

  var titulos = { dia:'Del día', esperando:'Esperando respuesta', copia:'En copia' };
  var fuentes = {
    dia: app.correo.delDia,
    esperando: app.correo.esperando,
    copia: app.correo.enCopia
  };
  var items = fuentes[app.filtro] || [];

  var html = '<h2 class="titulo-bloque">' + esc(titulos[app.filtro]) + '</h2>';
  html += items.length
    ? listaCorreo(items)
    : '<p class="vacio">Nada por acá.</p>';

  $('correoLista').innerHTML = html;
  conectarAccionesCorreo();
}

function listaCorreo(items) {
  var html = '<ul class="lista">';

  items.forEach(function (item) {
    var detalle = [];
    if (item.de) detalle.push(esc(item.de));
    if (item.hora) detalle.push(esc(item.hora));
    if (item.dias) detalle.push('sin respuesta hace ' + item.dias + ' días');
    if (item.anterior) detalle.push('marcado antes');
    if (item.sinLeer) detalle.push('<span class="nuevo">' + item.sinLeer + ' sin leer</span>');

    var enlace = item.url
      ? '<a href="' + esc(item.url) + '" target="_blank">' + esc(item.asunto) + '</a>'
      : esc(item.asunto);

    html += '<li data-hilo="' + esc(item.id) + '">' +
      '<div class="crece">' + enlace +
        '<span class="detalle">' + detalle.join(' · ') + '</span></div>' +
      '<div class="acciones">' +
        botonNivel(item, 'importante', '★', 'Marcar como importante') +
        botonNivel(item, 'silenciado', '✕', 'Silenciar este hilo') +
      '</div></li>';
  });

  return html + '</ul>';
}

/** Los dos botones son interruptores: si ya está en ese nivel, vuelve a normal. */
function botonNivel(item, nivel, simbolo, titulo) {
  var activo = item.nivel === nivel;
  var clase = 'icono' + (activo ? (nivel === 'importante' ? ' on' : ' off') : '');
  return '<button class="' + clase + '" title="' + esc(titulo) +
    '" data-nivel="' + nivel + '" data-hilo="' + esc(item.id) + '">' + simbolo + '</button>';
}

function conectarAccionesCorreo() {
  document.querySelectorAll('#seccion-correo [data-nivel]').forEach(function (boton) {
    boton.addEventListener('click', function () {
      marcar(boton.dataset.hilo, boton.dataset.nivel);
    });
  });
}

/**
 * Cambia la marca en memoria y repinta al instante; la escritura va por detrás.
 * Si el servidor falla, se deshace el cambio y se avisa.
 */
function marcar(idHilo, nivelPedido) {
  var item = buscarHilo(idHilo);
  if (!item) return;

  var anterior = item.nivel;
  var nuevo = (anterior === nivelPedido) ? 'normal' : nivelPedido;

  item.nivel = nuevo;
  reclasificarEnMemoria(item, nuevo, anterior);
  pintarCorreo();

  google.script.run
    .withFailureHandler(function (error) {
      item.nivel = anterior;
      reclasificarEnMemoria(item, anterior, nuevo);
      pintarCorreo();
      $('correoResumen').textContent = 'No se pudo guardar la marca: ' + mensajeError(error);
    })
    .marcarPrioridad(
      { id: item.id, asunto: item.asunto, de: item.de, url: item.url },
      nuevo
    );
}

function buscarHilo(idHilo) {
  var listas = [app.correo.importantes, app.correo.delDia,
                app.correo.enCopia, app.correo.esperando];
  for (var i = 0; i < listas.length; i++) {
    for (var j = 0; j < listas[i].length; j++) {
      if (listas[i][j].id === idHilo) return listas[i][j];
    }
  }
  return null;
}

/**
 * Mueve el hilo entre las listas que ya tenemos en memoria, con el mismo
 * criterio que usa el servidor, para no tener que volver a pedir el digest.
 */
function reclasificarEnMemoria(item, nuevo, anterior) {
  var d = app.correo;

  var quitar = function (lista) {
    var indice = lista.indexOf(item);
    if (indice !== -1) lista.splice(indice, 1);
  };

  if (anterior === 'importante') quitar(d.importantes);
  quitar(d.delDia);
  quitar(d.enCopia);

  if (nuevo === 'importante') {
    d.importantes.unshift(item);
  } else if (nuevo === 'silenciado') {
    d.totales.silenciados += 1;
    quitar(d.esperando);
  } else if (item.dias) {
    // Volvió a normal y es un hilo de "esperando respuesta": ya está en su lista.
  } else {
    d.delDia.unshift(item);
  }

  if (anterior === 'silenciado' && nuevo !== 'silenciado' && d.totales.silenciados > 0) {
    d.totales.silenciados -= 1;
  }
  d.totales.importantes = d.importantes.length;
  d.totales.esperando = d.esperando.length;
}

// -------------------------------------------------------------------- agenda
function cargarAgenda() {
  $('btnAgenda').disabled = true;
  google.script.run
    .withSuccessHandler(function (datos) { $('btnAgenda').disabled = false; pintarAgenda(datos); })
    .withFailureHandler(function (e) { $('btnAgenda').disabled = false; pintarError('agendaCuerpo', e); })
    .obtenerAgenda();
}

function pintarAgenda(datos) {
  if (!datos.eventos.length) {
    $('agendaCuerpo').innerHTML = '<p class="vacio">Hoy no tenés nada agendado.</p>';
    return;
  }

  var html = '<ul class="lista">';
  datos.eventos.forEach(function (ev) {
    var detalle = [];
    if (ev.fin) detalle.push('hasta ' + esc(ev.fin));
    if (ev.ubicacion) detalle.push(esc(ev.ubicacion));
    if (ev.invitados > 1) detalle.push(ev.invitados + ' invitados');
    if (ev.estado === 'en curso') detalle.push('en curso');

    html += '<li><div class="hora' + (ev.estado === 'en curso' ? ' ahora' : '') + '">' +
      esc(ev.todoElDia ? 'Día' : ev.inicio) + '</div>' +
      '<div class="crece">' + esc(ev.titulo) +
      (detalle.length ? '<span class="detalle">' + detalle.join(' · ') + '</span>' : '') +
      '</div></li>';
  });
  $('agendaCuerpo').innerHTML = html + '</ul>';
}

// --------------------------------------------------------------------- metas
function cargarMetas() {
  google.script.run
    .withSuccessHandler(pintarMetas)
    .withFailureHandler(function (e) { pintarError('metasCuerpo', e); })
    .obtenerMetas(app.fechaIso);
}

function pintarMetas(d) {
  $('metasPorcentaje').textContent = d.porcentaje + '%';
  $('metasBarra').style.width = d.porcentaje + '%';
  $('metasConteo').textContent = d.total
    ? d.hechas + ' de ' + d.total + ' cumplidas'
    : 'sin metas todavía';

  if (!d.metas.length) {
    $('metasCuerpo').innerHTML = '<p class="vacio">Poné una o dos metas para hoy.</p>';
    return;
  }

  var html = '<ul class="lista">';
  d.metas.forEach(function (m) {
    html += '<li><label class="check">' +
      '<input type="checkbox" data-meta="' + esc(m.id) + '"' + (m.hecha ? ' checked' : '') + '>' +
      '<span class="' + (m.hecha ? 'hecha' : '') + '">' + esc(m.texto) + '</span></label>' +
      '<button class="btn btn-texto" data-borrar-meta="' + esc(m.id) + '">Quitar</button></li>';
  });
  $('metasCuerpo').innerHTML = html + '</ul>';

  $('metasCuerpo').querySelectorAll('[data-meta]').forEach(function (caja) {
    caja.addEventListener('change', function () {
      caja.disabled = true;
      google.script.run
        .withSuccessHandler(pintarMetas)
        .withFailureHandler(function (e) { caja.disabled = false; pintarError('metasCuerpo', e); })
        .cambiarEstadoMeta(caja.dataset.meta, caja.checked);
    });
  });

  $('metasCuerpo').querySelectorAll('[data-borrar-meta]').forEach(function (boton) {
    boton.addEventListener('click', function () {
      boton.disabled = true;
      google.script.run
        .withSuccessHandler(pintarMetas)
        .withFailureHandler(function (e) { boton.disabled = false; pintarError('metasCuerpo', e); })
        .eliminarMeta(boton.dataset.borrarMeta);
    });
  });
}

function enviarMeta(evento) {
  evento.preventDefault();
  var campo = $('metaTexto');
  if (!campo.value.trim()) return;
  var texto = campo.value;
  campo.disabled = true;

  google.script.run
    .withSuccessHandler(function (d) {
      campo.disabled = false; campo.value = ''; campo.focus(); pintarMetas(d);
    })
    .withFailureHandler(function (e) { campo.disabled = false; pintarError('metasCuerpo', e); })
    .agregarMeta(texto, app.fechaIso);
}

// ---------------------------------------------------------------- pendientes
function cargarPendientes() {
  google.script.run
    .withSuccessHandler(pintarPendientes)
    .withFailureHandler(function (e) { pintarError('pendientesCuerpo', e); })
    .obtenerPendientes();
}

function pintarPendientes(d) {
  if (!d.pendientes.length) {
    $('pendientesCuerpo').innerHTML = '<p class="vacio">Nada anotado.</p>';
    return;
  }

  var html = '<ul class="lista">';
  d.pendientes.forEach(function (p) {
    html += '<li><div class="crece">' + esc(p.descripcion) +
      '<span class="detalle">desde el ' + esc(p.creado) + '</span></div>' +
      '<button class="btn btn-texto" data-cerrar="' + esc(p.id) + '">Listo</button></li>';
  });
  $('pendientesCuerpo').innerHTML = html + '</ul>';

  $('pendientesCuerpo').querySelectorAll('[data-cerrar]').forEach(function (boton) {
    boton.addEventListener('click', function () {
      boton.disabled = true;
      google.script.run
        .withSuccessHandler(pintarPendientes)
        .withFailureHandler(function (e) { boton.disabled = false; pintarError('pendientesCuerpo', e); })
        .cerrarPendiente(boton.dataset.cerrar);
    });
  });
}

function enviarPendiente(evento) {
  evento.preventDefault();
  var campo = $('pendienteTexto');
  if (!campo.value.trim()) return;
  var texto = campo.value;
  campo.disabled = true;

  google.script.run
    .withSuccessHandler(function (d) {
      campo.disabled = false; campo.value = ''; campo.focus(); pintarPendientes(d);
    })
    .withFailureHandler(function (e) { campo.disabled = false; pintarError('pendientesCuerpo', e); })
    .agregarPendiente(texto);
}

// --------------------------------------------------------------------- notas
function cargarNotas() {
  google.script.run
    .withSuccessHandler(pintarNotas)
    .withFailureHandler(function (e) { pintarError('notasCuerpo', e); })
    .obtenerNotas();
}

function pintarNotas(notas) {
  app.notas = notas;

  if (!notas.length) {
    $('notasCuerpo').innerHTML = '<p class="vacio">Todavía no guardaste ninguna nota.</p>';
    return;
  }

  var html = '<ul class="lista">';
  notas.forEach(function (n) {
    var resumen = n.texto.length > 150 ? n.texto.slice(0, 150) + '…' : n.texto;
    html += '<li><div class="crece">' + esc(resumen) +
      '<span class="detalle">' + esc(n.actualizada) + '</span></div>' +
      '<button class="btn btn-texto" data-editar="' + esc(n.id) + '">Editar</button>' +
      '<button class="btn btn-texto" data-borrar-nota="' + esc(n.id) + '">Borrar</button></li>';
  });
  $('notasCuerpo').innerHTML = html + '</ul>';

  $('notasCuerpo').querySelectorAll('[data-editar]').forEach(function (boton) {
    boton.addEventListener('click', function () {
      var nota = app.notas.filter(function (n) { return n.id === boton.dataset.editar; })[0];
      if (!nota) return;
      app.notaEditando = nota.id;
      $('notaTexto').value = nota.texto;
      $('btnGuardarNota').textContent = 'Guardar cambios';
      $('btnCancelarNota').hidden = false;
      $('notaTexto').focus();
    });
  });

  $('notasCuerpo').querySelectorAll('[data-borrar-nota]').forEach(function (boton) {
    boton.addEventListener('click', function () {
      boton.disabled = true;
      google.script.run
        .withSuccessHandler(function (lista) { salirDeEdicion(); pintarNotas(lista); })
        .withFailureHandler(function (e) { boton.disabled = false; pintarError('notasCuerpo', e); })
        .eliminarNota(boton.dataset.borrarNota);
    });
  });
}

function enviarNota(evento) {
  evento.preventDefault();
  var campo = $('notaTexto');
  if (!campo.value.trim()) return;

  var boton = $('btnGuardarNota');
  boton.disabled = true;

  var alGuardar = function (lista) { boton.disabled = false; salirDeEdicion(); pintarNotas(lista); };
  var alFallar = function (e) { boton.disabled = false; pintarError('notasCuerpo', e); };

  if (app.notaEditando) {
    google.script.run.withSuccessHandler(alGuardar).withFailureHandler(alFallar)
      .guardarNota(app.notaEditando, campo.value);
  } else {
    google.script.run.withSuccessHandler(alGuardar).withFailureHandler(alFallar)
      .agregarNota(campo.value);
  }
}

function salirDeEdicion() {
  app.notaEditando = null;
  $('notaTexto').value = '';
  $('btnGuardarNota').textContent = 'Guardar';
  $('btnCancelarNota').hidden = true;
}
</script>
